modules = ["python-3.12", "nodejs-20", "web"]

[nix]
channel = "stable-25_05"
packages = ["python313"]

[agent]
expertMode = true

[userenv]

[userenv.shared]
CORS_ALLOW_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173,https://kiraorder-web.replit.app,https://hozier123.github.io"
AI_PROVIDER = "runpod_adapter"
RUNPOD_MODEL_NAME = "Qwen/Qwen2.5-7B-Instruct-AWQ"
LLM_TIMEOUT_S = "4.1"

[[ports]]
localPort = 8000
externalPort = 80

[deployment]
deploymentTarget = "autoscale"
build = "cd backend && python3.13 -I -m venv .venv313 && PIP_CONFIG_FILE=/dev/null .venv313/bin/python -m pip install -c requirements.lock -e '.[test]'"
run = "cd backend && .venv313/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"